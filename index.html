<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>𝟮𝟬𝗫 𝗢𝗙𝗙𝗜𝗖𝗜𝗔𝗟ᴰᴷ ᵂᴵᴺ</title>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&amp;family=Bungee&amp;family=Chakra+Petch:wght@500;600;700&amp;family=Orbitron:wght@600;700;800;900&amp;family=Share+Tech+Mono&amp;family=Teko:wght@600;700&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;900&amp;family=Cinzel:wght@700;900&amp;display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════
           BASE / RESET — ডার্ক ব্যাকগ্রাউন্ড (গ্লো হলুদ থিম)
           ═══════════════════════════════════════════ */
        html, body {
            background: #0f0c00 !important;
            background-color: #0f0c00 !important;
            overflow: hidden;
            width: 100%;
            height: 100%;
            height: 100dvh;
            position: fixed;
            inset: 0;
            margin: 0;
            padding: 0;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        #fullscreen-bg-frame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            border: 0;
            z-index: 1;
            background: #0f0c00;
            pointer-events: auto;
            display: block;
            overflow: hidden;
            -webkit-overflow-scrolling: touch;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        #fullscreen-bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
            display: none;
            background: #0f0c00;
        }

        #tufan-widget-root .box-bg-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
            border-radius: 36px;
            opacity: 0.8;
            filter: contrast(1.1) brightness(0.95);
        }
        #tufan-widget-root .box-video-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            border-radius: 36px;
            background: radial-gradient(circle at 50% 20%, rgba(0,0,0,0.1), rgba(15,12,0,0.65) 85%);
        }

        #tufan-widget-root {
            --green: #ffe600;
            --green2: #ffb700;
            --lime: #fff740;
            --cyan: #00eaff;
            --gold: #ffe600;
            --red: #ff225d;
            --purple: #bc28ff;
            --ink: #0a0800;
            --panel: #141000;
            --flight: 2.25s;
            --scan-progress: 0;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            pointer-events: none;
            overflow: visible;
        }
        #tufan-widget-root .launcher,
        #tufan-widget-root .wrap {
            pointer-events: auto;
        }
        #tufan-widget-root,
        #tufan-widget-root * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            font-family: Orbitron, sans-serif;
        }
        #tufan-widget-root .hidden { display: none !important; }

        #tufan-widget-root .launcher {
            position: fixed; left: 0; top: 0; width: 58px; height: 58px;
            z-index: 9999; display: grid; place-items: center;
            border: 1.5px solid rgba(255,230,0,.65); border-radius: 50%;
            cursor: grab; touch-action: none;
            background: radial-gradient(circle at 32% 25%, rgba(255,230,0,.34), transparent 48%),
                        linear-gradient(145deg, #2c2000, #0d0900 62%, #000);
            box-shadow: 0 12px 28px #000, 0 0 18px rgba(255,230,0,.48), inset 0 0 15px rgba(255,230,0,.24);
            will-change: transform;
        }
        #tufan-widget-root .launcher:active { cursor: grabbing; }
        @keyframes sxOrbCoreFloat { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-3px) rotate(2deg); } }
        #tufan-widget-root .launcher-glass {
            position: absolute; inset: 3px; border: 1px solid rgba(255,255,255,.14);
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,.16), transparent 55%);
        }
        #tufan-widget-root .launcher-core {
            position: relative; z-index: 4; width: 72%; height: 72%;
            display: grid; place-items: center; overflow: hidden; border-radius: 50%;
            filter: drop-shadow(0 0 6px var(--green));
            animation: sxOrbCoreFloat 3.8s ease-in-out infinite;
        }
        #tufan-widget-root .launcher-icon-img {
            width: 100%; height: 100%; display: block; object-fit: cover;
            border-radius: 50%; pointer-events: none;
        }
        #tufan-widget-root .launcher-fallback {
            font: 900 17px 'Chakra Petch', sans-serif;
            color: var(--green); text-shadow: 0 0 8px var(--green);
        }
        #tufan-widget-root .launcher-ring {
            position: absolute; inset: -8px; width: calc(100% + 16px); height: calc(100% + 16px);
            pointer-events: none;
        }
        #tufan-widget-root .launcher-ring circle {
            fill: none; stroke: var(--green); stroke-width: 1.7;
            stroke-linecap: round; stroke-dasharray: 28 16;
            transform-origin: 50% 50%; animation: sxSpin 6s linear infinite;
            filter: drop-shadow(0 0 3px var(--green));
        }
        #tufan-widget-root .launcher-ring .r2 {
            stroke: var(--lime); stroke-width: 1.1;
            stroke-dasharray: 8 21; animation-duration: 4s; animation-direction: reverse;
        }
        #tufan-widget-root .launcher-orbit {
            position: absolute; inset: -6px; z-index: 3;
            animation: sxSpin 3s linear infinite;
        }
        #tufan-widget-root .launcher-orbit i {
            position: absolute; top: -2px; left: 50%; width: 5px; height: 5px;
            border-radius: 50%; background: #fff; box-shadow: 0 0 9px var(--lime);
        }
        @keyframes sxSpin { to { transform: rotate(360deg); } }

        #tufan-widget-root .wrap {
            position: fixed; left: 0; top: 0; z-index: 10000;
            display: none; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; touch-action: none;
            scale: .9; transition: opacity .2s ease, scale .25s cubic-bezier(.2,.9,.2,1.1);
            will-change: transform;
        }
        #tufan-widget-root .wrap.visible {
            display: flex; opacity: 1; pointer-events: auto; scale: 1;
        }
        #tufan-widget-root .wrap.dragging { transition: none !important; }

        #tufan-widget-root .flight-chassis {
            position: relative; display: flex; align-items: center; justify-content: center;
            will-change: transform;
        }
        #tufan-widget-root .wing-backlight {
            position: absolute; width: 280px; height: 160px; z-index: 0;
            pointer-events: none;
            background: radial-gradient(ellipse, rgba(255,230,0,.045), transparent 70%);
            filter: blur(8px);
        }
        #tufan-widget-root .wing {
            position: absolute; top: 48%; width: 220px; height: 165px; z-index: 1;
            pointer-events: none;
            background: url('https://i.ibb.co/mF1fS5m2/file-0000000017bc8211a51be6c0e30fe47a.png') center/contain no-repeat;
            filter: hue-rotate(-55deg) drop-shadow(0 0 4px rgba(255,230,0,.35));
            will-change: transform;
        }
        #tufan-widget-root .wing.left {
            left: -80px; background-position: left center;
            clip-path: polygon(0 0, 66% 0, 66% 100%, 0 100%);
            transform-origin: right 58%;
            animation: sxFlapL var(--flight) ease-in-out infinite;
        }
        #tufan-widget-root .wing.right {
            right: -80px; background-position: right center;
            clip-path: polygon(34% 0, 100% 0, 100% 100%, 34% 100%);
            transform-origin: left 58%;
            animation: sxFlapR var(--flight) ease-in-out infinite;
        }
        @keyframes sxFlapL { 0%, 100% { transform: translateY(-50%) rotate(-12deg) scaleY(.94); } 50% { transform: translateY(-50%) rotate(14deg) scaleY(1.06); } }
        @keyframes sxFlapR { 0%, 100% { transform: translateY(-50%) rotate(12deg) scaleY(.94); } 50% { transform: translateY(-50%) rotate(-14deg) scaleY(1.06); } }

        #tufan-widget-root .wing-particles {
            position: absolute; top: 48%; width: 220px; height: 165px; z-index: 2;
            pointer-events: none; transform: translateY(-50%);
        }
        #tufan-widget-root .wing-particles.left { left: -80px; animation: sxFlapL var(--flight) ease-in-out infinite; }
        #tufan-widget-root .wing-particles.right { right: -80px; animation: sxFlapR var(--flight) ease-in-out infinite; }
        #tufan-widget-root .wp {
            position: absolute; width: 2px; height: 2px; border-radius: 50%;
            background: radial-gradient(circle, #ffffff 0%, #ffffef 20%, #fffc9d 48%, #ffd834 72%, transparent 88%);
            box-shadow: 0 0 4px rgba(255,255,255,.95), 0 0 8px rgba(255,248,135,.62), 0 0 14px rgba(255,235,70,.32);
            opacity: 0; will-change: transform, opacity;
        }
        #tufan-widget-root .wp.p1 { top: 20%; left: 15%; animation: sxWingP1 2.4s ease-in-out infinite; }
        #tufan-widget-root .wp.p2 { top: 40%; left: 8%; width: 2px; height: 2px; animation: sxWingP2 2.8s ease-in-out .3s infinite; }
        #tufan-widget-root .wp.p3 { top: 60%; left: 22%; width: 3px; height: 3px; animation: sxWingP3 2.2s ease-in-out .6s infinite; }
        #tufan-widget-root .wp.p4 { top: 30%; left: 35%; width: 2px; height: 2px; background: radial-gradient(circle, #fff 0%, #ffffdf 26%, #fff563 58%, transparent 82%); box-shadow: 0 0 5px rgba(255,255,255,.9), 0 0 10px rgba(255,242,95,.48); animation: sxWingP4 2.6s ease-in-out .9s infinite; }
        #tufan-widget-root .wp.p5 { top: 75%; left: 12%; width: 2px; height: 2px; background: radial-gradient(circle, #fff 0%, #ffffe9 28%, #ffee52 58%, transparent 82%); box-shadow: 0 0 5px rgba(255,255,255,.9), 0 0 10px rgba(255,238,82,.46); animation: sxWingP5 2.3s ease-in-out 1.1s infinite; }
        #tufan-widget-root .wp.p6 { top: 50%; left: 45%; width: 2px; height: 2px; animation: sxWingP6 2.5s ease-in-out .4s infinite; }
        @keyframes sxWingP1 { 0%, 100% { transform: translate(0,0) scale(0); opacity: 0; } 20% { opacity: 1; transform: scale(1); } 50% { transform: translate(-18px,-14px) scale(1.2); opacity: 1; } }
        @keyframes sxWingP2 { 0%, 100% { transform: translate(0,0) scale(0); opacity: 0; } 30% { opacity: 1; } 50% { transform: translate(-14px,10px) scale(1.4); opacity: .9; } }
        @keyframes sxWingP3 { 0%, 100% { transform: translate(0,0) scale(0); opacity: 0; } 25% { opacity: 1; transform: scale(1); } 50% { transform: translate(-20px,-8px) scale(1.3); opacity: 1; } }
        @keyframes sxWingP4 { 0%, 100% { transform: translate(0,0) scale(0); opacity: 0; } 30% { opacity: 1; } 55% { transform: translate(-12px,-18px) scale(1.5); opacity: .95; } }
        @keyframes sxWingP5 { 0%, 100% { transform: translate(0,0) scale(0); opacity: 0; } 25% { opacity: 1; } 50% { transform: translate(-16px,14px) scale(1.2); opacity: 1; } }
        @keyframes sxWingP6 { 0%, 100% { transform: translate(0,0) scale(0); opacity: 0; } 30% { opacity: 1; } 50% { transform: translate(-22px,-6px) scale(1.3); opacity: .9; } }

        #tufan-widget-root .claw-layer {
            position: absolute; top: 32px; width: 42px; height: 165px;
            z-index: 25; pointer-events: none;
        }
        #tufan-widget-root .claw-layer.left { left: -20px; }
        #tufan-widget-root .claw-layer.right { right: -20px; transform: scaleX(-1); }
        #tufan-widget-root .claw-shake { width: 100%; height: 100%; animation: sxClawShake 7.5s infinite; }
        #tufan-widget-root .finger { position: absolute; width: 100%; transform-origin: left center; }
        #tufan-widget-root .f1 { top: 10px; animation: sxF1 3s infinite; }
        #tufan-widget-root .f2 { top: 45px; animation: sxF2 4s -1.2s infinite; }
        #tufan-widget-root .f3 { top: 82px; animation: sxF3 3.5s -2s infinite; }
        #tufan-widget-root .f4 { top: 118px; animation: sxF4 5s -3s infinite; }
        #tufan-widget-root .f-base {
            position: absolute; left: 0; width: 21px; height: 11px;
            border-top: 1px solid rgba(255,245,100,.5); border-radius: 6px 0 0 6px;
            background: linear-gradient(#6c5600, #0a0800); box-shadow: 2px 2px 5px #000;
        }
        #tufan-widget-root .f-mid {
            position: absolute; left: 18px; top: 1px; width: 14px; height: 9px;
            border-radius: 2px; background: linear-gradient(#a58408, #0a0800);
            transform: rotate(-12deg); transform-origin: left;
        }
        #tufan-widget-root .f-tip {
            position: absolute; left: 10px; top: 1px; width: 23px; height: 8px;
            clip-path: polygon(0 10%, 100% 45%, 0 90%, 25% 45%);
            background: linear-gradient(90deg, #fff, #ffe600 36%, #4f3d00);
            filter: drop-shadow(0 0 3px var(--green));
            transform: rotate(-24deg); transform-origin: left;
        }
        @keyframes sxClawShake { 66%, 78% { transform: translate(1.5px,-1px); } 68%, 80% { transform: translate(-1.5px,1px); } }
        @keyframes sxF1 { 0%, 100% { transform: rotate(24deg); } 25% { transform: rotate(29deg); } }
        @keyframes sxF2 { 0%, 100% { transform: rotate(9deg); } 30% { transform: rotate(14deg); } }
        @keyframes sxF3 { 0%, 100% { transform: rotate(-6deg); } 20% { transform: rotate(-2deg); } }
        @keyframes sxF4 { 0%, 100% { transform: rotate(-21deg); } 35% { transform: rotate(-15deg); } }

        #tufan-widget-root .box-wrapper {
            position: relative; z-index: 10; width: 218px; height: 276px;
            display: flex; overflow: hidden; padding: 2px; border-radius: 38px;
            background: #000; isolation: isolate; cursor: grab;
            box-shadow: 0 0 30px rgba(255,230,0,.38), 0 18px 50px rgba(0,0,0,.96);
        }
        #tufan-widget-root .box-wrapper:active { cursor: grabbing; }
        #tufan-widget-root .box-wrapper:before,
        #tufan-widget-root .box-wrapper:after {
            content: ""; position: absolute; left: -75%; top: -75%;
            width: 250%; height: 250%; z-index: 0;
            background: conic-gradient(from 0deg, transparent 64%, var(--green) 77%, #fff 82%, var(--cyan) 87%, transparent 100%);
            animation: sxPlasma 3.8s linear infinite;
        }
        #tufan-widget-root .box-wrapper:after {
            background: conic-gradient(from 180deg, transparent 64%, var(--green2) 77%, var(--gold) 82%, var(--lime) 88%, transparent 100%);
            animation-duration: 5.2s; animation-direction: reverse; opacity: .72;
        }
        @keyframes sxPlasma { to { transform: rotate(360deg); } }

        #tufan-widget-root .box {
            position: relative; z-index: 2; width: 100%; height: 100%;
            overflow: hidden; border-radius: 36px; padding: 10px 9px 9px;
            background: radial-gradient(circle at 50% -10%, rgba(120,95,0,.72), transparent 53%),
                        linear-gradient(rgba(18,14,0,.85), rgba(15,10,0,.9) 57%, rgba(0,2,1,.95));
            box-shadow: inset 0 0 22px rgba(255,230,0,.24);
        }
        #tufan-widget-root .box:after {
            content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none;
            border-radius: inherit;
            background: linear-gradient(112deg, transparent 20%, rgba(255,255,255,.08) 35%, transparent 49%);
            transform: translateX(-130%); animation: sxPanelShine 6.3s linear infinite;
        }
        @keyframes sxPanelShine { to { transform: translateX(160%); } }
        #tufan-widget-root .ambient {
            position: absolute; inset: -40%; z-index: 0; pointer-events: none;
            background: radial-gradient(circle at 30% 70%, rgba(0,234,255,.08), transparent 28%),
                        radial-gradient(circle at 65% 35%, rgba(255,230,0,.15), transparent 30%);
            filter: blur(13px); animation: sxAmbient 10s ease-in-out infinite alternate;
        }
        @keyframes sxAmbient { to { transform: rotate(24deg) scale(1.15); } }
        #tufan-widget-root .dot-field {
            position: absolute; inset: 0; z-index: 1; overflow: hidden; pointer-events: none;
        }
        #tufan-widget-root .dot-field i {
            position: absolute; bottom: -8px; width: 3px; height: 3px; border-radius: 50%;
            background: var(--green); box-shadow: 0 0 5px var(--green);
            opacity: 0; animation: sxRise 5s linear infinite;
        }
        #tufan-widget-root .dot-field i:nth-child(1) { left: 12%; animation-delay: 0s; }
        #tufan-widget-root .dot-field i:nth-child(2) { left: 29%; animation-delay: 1.2s; animation-duration: 6s; }
        #tufan-widget-root .dot-field i:nth-child(3) { left: 49%; animation-delay: 2.4s; }
        #tufan-widget-root .dot-field i:nth-child(4) { left: 72%; animation-delay: .6s; animation-duration: 5.8s; }
        #tufan-widget-root .dot-field i:nth-child(5) { left: 87%; animation-delay: 3s; animation-duration: 4.7s; }
        @keyframes sxRise { 20%, 78% { opacity: .8; } to { transform: translateY(-285px) scale(1.25); opacity: 0; } }

        #tufan-widget-root .gloss-stream {
            position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 3;
        }
        #tufan-widget-root .gloss-line {
            position: absolute; width: 1.5px; border-radius: 2px; opacity: 0;
            background: linear-gradient(180deg, transparent, rgba(255,230,0,.2) 20%, #fff 60%, rgba(255,230,0,.9) 80%, transparent);
            filter: drop-shadow(0 0 3px var(--green));
            animation: sxGlossFall linear infinite;
        }
        #tufan-widget-root .gl-1 { left: 16%; height: 46px; animation-duration: 2.6s; }
        #tufan-widget-root .gl-2 { left: 38%; height: 32px; animation-duration: 3.2s; animation-delay: 1.1s; }
        #tufan-widget-root .gl-3 { left: 64%; height: 52px; animation-duration: 2.2s; animation-delay: .5s; }
        #tufan-widget-root .gl-4 { left: 84%; height: 38px; animation-duration: 3s; animation-delay: 1.7s; }
        #tufan-widget-root .gl-5 { left: 50%; height: 44px; animation-duration: 2.8s; animation-delay: 2.1s; }
        @keyframes sxGlossFall { 0% { transform: translateY(-60px); opacity: 0; } 25%, 75% { opacity: .9; } 100% { transform: translateY(290px); opacity: 0; } }
        #tufan-widget-root .panel-sweep {
            position: absolute; inset: 0; z-index: 3; pointer-events: none;
            overflow: hidden; border-radius: 36px;
        }
        #tufan-widget-root .panel-sweep:before {
            content: ""; position: absolute; top: -30%; left: -60%;
            width: 60%; height: 160%;
            background: linear-gradient(90deg, transparent, rgba(255,230,0,.07) 45%, rgba(255,255,255,.12) 50%, rgba(255,230,0,.07) 55%, transparent);
            transform: skewX(-18deg); animation: sxPanelSweep 6.5s linear infinite; filter: blur(1px);
        }
        @keyframes sxPanelSweep { to { transform: translateX(320%) skewX(-18deg); } }
        #tufan-widget-root .bg-anim {
            position: absolute; inset: 0; border-radius: 36px;
            overflow: hidden; pointer-events: none; z-index: 1;
        }
        #tufan-widget-root .aurora {
            position: absolute; width: 200%; height: 200%; top: -50%; left: -50%;
            background: radial-gradient(circle at 50% 50%, rgba(255,230,0,.16), transparent 40%),
                        radial-gradient(circle at 30% 70%, rgba(255,230,0,.10), transparent 40%),
                        radial-gradient(circle at 70% 30%, rgba(255,235,0,.10), transparent 40%);
            filter: blur(14px); animation: sxAurora 10s ease-in-out infinite alternate;
            mix-blend-mode: screen;
        }
        @keyframes sxAurora { 0% { transform: scale(1) rotate(0); } 50% { transform: scale(1.2) rotate(18deg); } 100% { transform: scale(1.05) rotate(-10deg); } }
        #tufan-widget-root .inner {
            position: relative; z-index: 5; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        #tufan-widget-root .hdr {
            display: flex; flex-direction: column; gap: 3px;
            padding-bottom: 3px; border-bottom: 1px solid rgba(255,230,0,.34);
        }
        #tufan-widget-root .title-bar {
            min-height: 25px; display: grid; place-items: center; overflow: hidden;
            padding: 3px 7px; border: 1px solid rgba(255,230,0,.46); border-radius: 8px;
            background: linear-gradient(90deg, rgba(255,230,0,.17), rgba(0,0,0,.9), rgba(0,234,255,.12));
            box-shadow: 0 2px 5px #000;
        }
        #tufan-widget-root .brand-wrapper {
            width: 100%; display: flex; justify-content: center; overflow: hidden;
        }
        #tufan-widget-root .card-title {
            display: inline-block; white-space: nowrap; color: #fff;
            font: 900 10px Audiowide; letter-spacing: .5px; text-align: center;
            text-shadow: 0 0 8px var(--green), 0 0 14px rgba(255,255,255,.35);
        }
        #tufan-widget-root .stat-strip { display: flex; gap: 3px; }
        #tufan-widget-root .stat-pill {
            flex: 1; display: flex; justify-content: center; gap: 2px;
            white-space: nowrap; padding: 2px;
            border: 1px solid rgba(255,230,0,.38); border-radius: 6px;
            background: linear-gradient(rgba(255,230,0,.18), rgba(20,16,0,.75));
            font: 6.3px 'Share Tech Mono', monospace; color: #fff;
        }
        #tufan-widget-root .stat-pill .val {
            color: var(--gold); font-weight: 700; text-shadow: 0 0 4px var(--gold);
        }

        #tufan-widget-root .stage {
            position: relative; flex: 1; display: grid; place-items: center; margin: 4px 0;
        }
        #tufan-widget-root .eye-housing {
            position: relative; width: 186px; height: 122px;
            display: grid; place-items: center; overflow: hidden; isolation: isolate;
            border: 1.2px solid rgba(255,230,0,.58); border-radius: 19px;
            background: radial-gradient(circle, rgba(0,234,255,.08), transparent 58%),
                        linear-gradient(145deg, rgba(27,21,0,.98), rgba(0,5,2,.99));
            box-shadow: 0 0 19px rgba(255,230,0,.35), inset 0 0 24px rgba(255,230,0,.2);
            perspective: 520px;
        }

                    if (matrix !== "none") {
                        const values = matrix.split(', ');
                        initialX = parseFloat(values[4]) || 0;
                        initialY = parseFloat(values[5]) || 0;
                    } else {
                        initialX = 0;
                        initialY = 0;
                    }
                    try { (handle || element).setPointerCapture(e.pointerId); } catch(err){}
                });

                (handle || element).addEventListener("pointermove", (e) => {
                    if (!isDragging) return;
                    const dx = e.clientX - startX;
                    const dy = e.clientY - startY;
                    element.style.transform = `translate3d(${initialX + dx}px, ${initialY + dy}px, 0px)`;
                });

                (handle || element).addEventListener("pointerup", (e) => {
                    isDragging = false;
                    element.classList.remove("dragging");
                    try { (handle || element).releasePointerCapture(e.pointerId); } catch(err){}
                });
            }

            makeDraggable(wrap);
            makeDraggable(orb);

            orb.addEventListener("click", () => {
                wrap.classList.add("visible");
                orb.classList.add("hidden");
            });

            closeBtn.addEventListener("click", () => {
                window.open("https://t.me/dkwin9dotcom", "_blank");
            });

            /* =========================
               FIREBASE CHECK PASSWORD
            ========================= */
            let failedAttempts = 0;
            const MAX_ATTEMPTS = 3;

            actionBtn.addEventListener("click", () => {
                const val = pwInput.value.trim();

                if (val === "") {
                    pwMsg.textContent = "✕ PLEASE ENTER KEY";
                    pwInput.style.animation = "none";
                    pwInput.offsetHeight;
                    pwInput.style.animation = "sxShake 0.4s ease";
                    return;
                }

                actionBtn.querySelector(".btn-label").textContent = "CHECKING...";

                db.ref("AccessKeys")
                    .once("value")
                    .then((snapshot) => {
                        const data = snapshot.val();
                        let isValid = false;

                        if (data) {
                            Object.values(data).forEach(savedKey => {
                                if (String(savedKey).trim() === val) {
                                    isValid = true;
                                }
                            });
                        }

                        if (isValid) {
                            pwMsg.textContent = "";
                            statusOverlay.classList.remove("show");
                            stageScanner.classList.add("active");
                            statusText.textContent = "SCANNING";

                            let progress = 0;
                            const interval = setInterval(() => {
                                progress += 2;
                                scanPctText.textContent = progress + "%";
                                document.documentElement.style.setProperty('--scan-progress', progress / 100);

                                if (progress === 40) {
                                    scanLogText.innerHTML = "[core] <span>ANALYZING WINGO API 30S</span>";
                                } else if (progress === 80) {
                                    scanLogText.innerHTML = "[sync] <span>CONNECTING TO WINGO SERVER</span>";
                                }

                                if (progress >= 100) {
                                    clearInterval(interval);
                                    scanFlash.classList.add("fire");
                                    setTimeout(() => {
                                        stageScanner.classList.remove("active");
                                        scanFlash.classList.remove("fire");
                                        predDisplay.classList.add("active", "reveal");
                                        statusText.textContent = "ONLINE";
                                        actionBtn.style.display = "none";
                                        startWingoPrediction();
                                    }, 400);
                                }
                            }, 40);
                        } else {
                            actionBtn.querySelector(".btn-label").textContent = "▶ LOGIN";
                            failedAttempts++;
                            if (failedAttempts >= MAX_ATTEMPTS) {
                                alert("❌ ৩ বার ভুল পাসওয়ার্ড! টেলিগ্রাম চ্যানেলে রিডাইরেক্ট করা হচ্ছে...");
                                window.location.href = "https://t.me/dkwin9dotcom";
                            } else {
                                pwMsg.textContent = "✕ INVALID KEY";
                                pwInput.style.animation = "none";
                                pwInput.offsetHeight;
                                pwInput.style.animation = "sxShake 0.4s ease";
                            }
                        }
                    })
                    .catch((err) => {
                        actionBtn.querySelector(".btn-label").textContent = "▶ LOGIN";
                        pwMsg.textContent = "✕ CONNECTION ERROR";
                    });
            });

            function getWinGoPeriod() {
                const now = new Date();
                const utcYear = now.getUTCFullYear();
                const utcMonth = String(now.getUTCMonth() + 1).padStart(2, '0');
                const utcDay = String(now.getUTCDate()).padStart(2, '0');
                
                const totalSecondsToday = now.getUTCHours() * 3600 + now.getUTCMinutes() * 60 + now.getUTCSeconds();
                const periodIndex = Math.floor(totalSecondsToday / 30) + 1;
                
                const formattedIndex = String(periodIndex).padStart(4, '0');
                return `${utcYear}${utcMonth}${utcDay}1000${formattedIndex}`;
            }

            function startWingoPrediction() {
                updatePredictionData();

                setInterval(() => {
                    const now = new Date();
                    const currentSec = now.getUTCSeconds();
                    let timeLeft = 30 - (currentSec % 30);
                    
                    predTimerText.textContent = timeLeft + "s";
                    predTimerFill.style.width = (timeLeft / 30) * 100 + "%";

                    if (timeLeft === 30 || predPeriodBox.textContent.includes("----")) {
                        updatePredictionData();
                    }
                }, 1000);
            }

            function updatePredictionData() {
                const currentPeriod = getWinGoPeriod();
                predPeriodBox.textContent = "PERIOD: " + currentPeriod;

                const isBig = Math.random() > 0.5;
                predBadge.textContent = isBig ? "BIG" : "SMALL";
                predBadge.className = "pred-badge " + (isBig ? "big" : "small");
                
                const randomNum = Math.floor(Math.random() * 10);
                document.getElementById("predNumVal").textContent = randomNum;
            }
        });
    </script>
</body>
</html>
